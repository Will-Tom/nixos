"submap[modal],Escape" = { action = "submap reset", repeat = false }
"submap[modal],space"  = { action = "spawn ~/bin/bar-toast modal 'SPACE - Launcher'; noctalia msg panel-toggle launcher", submap = "reset", repeat = false }
"submap[modal],Shift+space" = { action = "spawn ~/bin/bar-toast modal 'SHIFT + SPACE - Launcher (half)'; ~/bin/launch-sized 0.5", submap = "reset", repeat = false }

"submap[modal],h" = "window-focus-left"
"submap[modal],j" = "window-focus-down"
"submap[modal],k" = "window-focus-up"
"submap[modal],l" = "window-focus-right"
