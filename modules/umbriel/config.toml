"submap[modal],5" = "spawn ~/bin/bar-toast modal '5 - Workspace 5'; umbriel msg workspace-switch 5"
"submap[modal],6" = "spawn ~/bin/bar-toast modal '6 - Workspace 6'; umbriel msg workspace-switch 6"
"submap[modal],7" = "spawn ~/bin/bar-toast modal '7 - Workspace 7'; umbriel msg workspace-switch 7"
"submap[modal],8" = "spawn ~/bin/bar-toast modal '8 - Workspace 8'; umbriel msg workspace-switch 8"
"submap[modal],9" = "spawn ~/bin/bar-toast modal '9 - Workspace 9'; umbriel msg workspace-switch 9"

