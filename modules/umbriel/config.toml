# umbriel config
# Check edits with `umbriel config validate`. Reloads on save.

[general]
show_cheatsheet = false

# ==============================================================================
# Input

[input.keyboard]
layout = "us"
options = "caps:escape"

[input.cursor]
theme = "Posy_Cursor_Black"
size = 32
follows_focus = true            # cursor jumps to the focused window

[input.focus]
follows_mouse = true
follows_mouse_max_scroll = 0.0  # focus-follows-mouse never scrolls the view

# ==============================================================================
# Outputs

[output.DP-2]
mode = "2560x1080@74.991"
scale = 1.0
transform = "normal"
position = [0, 0]

[output.DP-3]
mode = "2560x1440@165.002"
scale = 1.0
transform = "normal"
position = [0, 1080]

[output.DP-1]
mode = "3840x2160@240.000"
scale = 1.25
transform = "normal"
position = [2560, 792]
# Always HDR (needs HDR enabled in the monitor's menu so its EDID offers PQ).
# The SDR desktop is shown at sdr_white (default 203 nits; panel peaks ~400).
# "auto" would switch to HDR only for fullscreen HDR content instead.
hdr = "on"

# ==============================================================================
# Appearance and layout

[colors]
background = "#000000ff"

[appearance]
border_width = 0
corner_radius = 0

[appearance.shadow]
enabled = false

[layout]
gap = 0
extent_presets = [0.33333, 0.5, 1.0]

# New tiled windows open full width (the terminal opens at half, see window
# rules; Super+Shift+Space launches something at half). Floating windows
# keep their own size.
[layout.scrolling]
default_extent_fraction = 1.0

[[workspace]]
name = "1"
[[workspace]]
name = "2"
[[workspace]]
name = "3"
[[workspace]]
name = "4"
[[workspace]]
name = "5"
[[workspace]]
name = "6"
[[workspace]]
name = "7"
[[workspace]]
name = "8"
[[workspace]]
name = "9"

# ==============================================================================
# Animations: fluid dissolve open/close

[effects.preset.dissolve_in]
kind = "animation"
shader = "effects/open.glsl"

[effects.preset.dissolve_out]
kind = "animation"
shader = "effects/close.glsl"

[animation.windows_in]
duration_ms = 750
curve = "linear"
effect = "dissolve_in"

[animation.windows_out]
duration_ms = 750
curve = "linear"
effect = "dissolve_out"

# ==============================================================================
# Screen zoom: cursor effects covering the output (radius 0), magnifying around
# the pointer. Stepped by ~/bin/zoom (Super+scroll, Super+middle click resets).

[effects.preset.zoom_1_5]
kind = "cursor"
shader = "effects/zoom/zoom_1_5.glsl"

[effects.preset.zoom_2]
kind = "cursor"
shader = "effects/zoom/zoom_2.glsl"

[effects.preset.zoom_3]
kind = "cursor"
shader = "effects/zoom/zoom_3.glsl"

[effects.preset.zoom_4]
kind = "cursor"
shader = "effects/zoom/zoom_4.glsl"

[effects.preset.zoom_6]
kind = "cursor"
shader = "effects/zoom/zoom_6.glsl"

[effects.preset.zoom_8]
kind = "cursor"
shader = "effects/zoom/zoom_8.glsl"

# ==============================================================================
# Window rules

[[window_rule]]
match.app_id = ["^com\\.mitchellh\\.ghostty$", "^kitty$"]
default_scrolling_extent = 0.5

[[window_rule]]
match.app_id = "^steam_app_.*"
vrr = "always"

[[window_rule]]
match.app_id = "^steam$"
default_focused = false
default_floating = false

# ==============================================================================
# Keybinds (defining this table replaces umbriel's built-in binds)

[keybinds]
# Modal layer. keyd maps the physical Esc key to F1.
"F1" = { action = "submap modal", repeat = false }

"XF86AudioRaiseVolume" = { action = "spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1+ -l 1.0", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1-", allow_when_locked = true }
"XF86AudioMute"        = { action = "spawn wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle", allow_when_locked = true, repeat = false }
"XF86AudioMicMute"     = { action = "spawn wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle", allow_when_locked = true, repeat = false }
"XF86AudioPlay"        = { action = "spawn playerctl play-pause", allow_when_locked = true, repeat = false }
"XF86AudioStop"        = { action = "spawn playerctl stop", allow_when_locked = true, repeat = false }
"XF86AudioPrev"        = { action = "spawn playerctl previous", allow_when_locked = true }
"XF86AudioNext"        = { action = "spawn playerctl next", allow_when_locked = true }
"XF86MonBrightnessUp"   = { action = "spawn brightnessctl --class=backlight set +10%", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn brightnessctl --class=backlight set 10%-", allow_when_locked = true }

# Launchers and one-shot actions show a fading "KEY - action" toast on the bar
# via ~/bin/bar-toast; repeatable focus/move/resize binds stay native (instant).
"Mod+Space" = { action = "spawn ~/bin/bar-toast super 'SPACE - Launcher'; noctalia msg panel-toggle launcher", repeat = false }
"Mod+Shift+Space" = { action = "spawn ~/bin/bar-toast super 'SHIFT + SPACE - Launcher (half)'; ~/bin/launch-sized 0.5", repeat = false }
"Mod+T"     = { action = "spawn ~/bin/bar-toast super 'T - Terminal'; ~/bin/term", repeat = false }
"Mod+Shift+T" = { action = "spawn ~/bin/bar-toast super 'SHIFT + T - Terminal (third)'; ~/bin/term --fraction 0.333", repeat = false }
"Mod+O"     = { action = "spawn ~/bin/bar-toast super 'O - Overview'; umbriel msg overview-toggle", repeat = false }
"Mod+S"     = { action = "spawn ~/bin/bar-toast super 'S - Close window'; umbriel msg window-close", repeat = false }
"Mod+Shift+S" = { action = "spawn ~/bin/bar-toast super 'SHIFT + S - Close workspace'; ~/bin/close-workspace", repeat = false }
"Mod+Tab"   = { action = "spawn ~/bin/bar-toast super 'TAB - Toggle bar'; noctalia msg bar-toggle", repeat = false }

# Screenshots: Mod+P → screenshots/tmp, Mod+Shift+P → screenshots
"Mod+P"       = { action = "spawn ~/bin/bar-toast super 'P - Screenshot (tmp)'; mkdir -p ~/Pictures/screenshots/tmp && grim -g \"$(slurp -d)\" ~/Pictures/screenshots/tmp/\"screenshot from $(date '+%Y-%m-%d %H-%M-%S').png\"", repeat = false }
"Mod+Shift+P" = { action = "spawn ~/bin/bar-toast super 'SHIFT + P - Screenshot'; mkdir -p ~/Pictures/screenshots && grim -g \"$(slurp -d)\" ~/Pictures/screenshots/\"Screenshot from $(date '+%Y-%m-%d %H-%M-%S').png\"", repeat = false }

"Mod+Left"  = "output-focus-left"
"Mod+Down"  = "output-focus-down"
"Mod+Up"    = "output-focus-up"
"Mod+Right" = "output-focus-right"
"Mod+Shift+Left"  = "column-move-to-output-left"
"Mod+Shift+Down"  = "column-move-to-output-down"
"Mod+Shift+Up"    = "column-move-to-output-up"
"Mod+Shift+Right" = "column-move-to-output-right"

"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+L" = "window-focus-right"
"Mod+Shift+H" = "column-move-left"
"Mod+Shift+J" = "window-move-down"
"Mod+Shift+K" = "window-move-up"
"Mod+Shift+L" = "column-move-right"

"Mod+G"               = "column-focus-first"
"Mod+semicolon"       = "column-focus-last"
"Mod+Shift+G"         = "column-move-to-first"
"Mod+Shift+semicolon" = "column-move-to-last"

"Mod+D"       = "workspace-next"
"Mod+U"       = "workspace-previous"
"Mod+Shift+D" = "column-move-to-workspace-next"
"Mod+Shift+U" = "column-move-to-workspace-previous"
"Mod+Page_Down" = "workspace-move-down"
"Mod+Page_Up"   = "workspace-move-up"

"Mod+1" = "spawn ~/bin/bar-toast super '1 - Workspace 1'; umbriel msg workspace-switch 1"
"Mod+2" = "spawn ~/bin/bar-toast super '2 - Workspace 2'; umbriel msg workspace-switch 2"
"Mod+3" = "spawn ~/bin/bar-toast super '3 - Workspace 3'; umbriel msg workspace-switch 3"
"Mod+4" = "spawn ~/bin/bar-toast super '4 - Workspace 4'; umbriel msg workspace-switch 4"
"Mod+5" = "spawn ~/bin/bar-toast super '5 - Workspace 5'; umbriel msg workspace-switch 5"
"Mod+6" = "spawn ~/bin/bar-toast super '6 - Workspace 6'; umbriel msg workspace-switch 6"
"Mod+7" = "spawn ~/bin/bar-toast super '7 - Workspace 7'; umbriel msg workspace-switch 7"
"Mod+8" = "spawn ~/bin/bar-toast super '8 - Workspace 8'; umbriel msg workspace-switch 8"
"Mod+9" = "spawn ~/bin/bar-toast super '9 - Workspace 9'; umbriel msg workspace-switch 9"
"Mod+Shift+1" = "spawn ~/bin/bar-toast super 'SHIFT + 1 - Move to workspace 1'; umbriel msg column-move-to-workspace 1"
"Mod+Shift+2" = "spawn ~/bin/bar-toast super 'SHIFT + 2 - Move to workspace 2'; umbriel msg column-move-to-workspace 2"
"Mod+Shift+3" = "spawn ~/bin/bar-toast super 'SHIFT + 3 - Move to workspace 3'; umbriel msg column-move-to-workspace 3"
"Mod+Shift+4" = "spawn ~/bin/bar-toast super 'SHIFT + 4 - Move to workspace 4'; umbriel msg column-move-to-workspace 4"
"Mod+Shift+5" = "spawn ~/bin/bar-toast super 'SHIFT + 5 - Move to workspace 5'; umbriel msg column-move-to-workspace 5"
"Mod+Shift+6" = "spawn ~/bin/bar-toast super 'SHIFT + 6 - Move to workspace 6'; umbriel msg column-move-to-workspace 6"
"Mod+Shift+7" = "spawn ~/bin/bar-toast super 'SHIFT + 7 - Move to workspace 7'; umbriel msg column-move-to-workspace 7"
