# ------------------------------------------------------------------------------
# submap: resize (a / Esc back to modal; F1 leaves both)

"submap[resize],1" = { action = "spawn ~/bin/bar-toast modal '1 - Full width'; umbriel msg window-set-primary-extent 1.0", submap = "reset", repeat = false }
"submap[resize],2" = { action = "spawn ~/bin/bar-toast modal '2 - Half width'; umbriel msg window-set-primary-extent 0.5", submap = "reset", repeat = false }
"submap[resize],3" = { action = "spawn ~/bin/bar-toast modal '3 - Third width'; umbriel msg window-set-primary-extent 0.333", submap = "reset", repeat = false }
# Shift+1/2/3 (! @ #): every tiled column on the workspace
"submap[resize],Shift+1" = { action = "spawn ~/bin/bar-toast modal '! - All to full width'; ~/bin/resize-all 1.0", submap = "reset", repeat = false }
"submap[resize],Shift+2" = { action = "spawn ~/bin/bar-toast modal '@ - All to half width'; ~/bin/resize-all 0.5", submap = "reset", repeat = false }
"submap[resize],Shift+3" = { action = "spawn ~/bin/bar-toast modal '# - All to third width'; ~/bin/resize-all 0.333", submap = "reset", repeat = false }
"submap[resize],f" = { action = "spawn ~/bin/bar-toast modal 'f - Fullscreen'; umbriel msg window-toggle-fullscreen", submap = "reset", repeat = false }
"submap[resize],h" = "window-modify-primary-extent -0.1"
"submap[resize],l" = "window-modify-primary-extent +0.1"
"submap[resize],j" = "window-modify-secondary-extent -0.1"
"submap[resize],k" = "window-modify-secondary-extent +0.1"
"submap[resize],a"      = { action = "submap reset", repeat = false }
"submap[resize],Escape" = { action = "submap reset", repeat = false }
"submap[resize],F1"     = { action = "spawn umbriel msg submap reset", submap = "reset", repeat = false }

# ------------------------------------------------------------------------------
# submap: power (a / Esc back to modal; F1 leaves both)

"submap[power],Delete" = { action = "spawn ~/bin/bar-toast modal 'DELETE - Suspend'; systemctl suspend", repeat = false }
"submap[power],r"      = { action = "spawn ~/bin/bar-toast modal 'r - Reboot'; systemctl reboot", repeat = false }
"submap[power],h"      = { action = "spawn ~/bin/bar-toast modal 'h - Hibernate'; systemctl hibernate", repeat = false }
"submap[power],u"      = { action = "spawn ~/bin/bar-toast modal 'u - Reboot to UEFI'; systemctl reboot --firmware-setup", repeat = false }
"submap[power],s"      = { action = "spawn ~/bin/bar-toast modal 's - Shutdown'; systemctl poweroff", repeat = false }
"submap[power],l"      = { action = "spawn ~/bin/bar-toast modal 'l - Lock'; umbriel msg submap reset; noctalia msg session lock", submap = "reset", repeat = false }
"submap[power],a"      = { action = "submap reset", repeat = false }
"submap[power],Escape" = { action = "submap reset", repeat = false }
"submap[power],F1"     = { action = "spawn umbriel msg submap reset", submap = "reset", repeat = false }

# ==============================================================================
# SESSIONS (modal T): persistent terminal sessions (modules/term-sessions.nix).
# The mode stays on after each action. m M c C / r (and t T with no session
# terminal focused, to pick the session) open the noctalia launcher
# on /ts and leave modal while it's open (so typing doesn't hit these keys);
# term-sessions returns to SESSIONS when the launcher closes.
# The fish command `se` does the same from a shell (also over ssh).

"submap[sessions],t"           = { action = "spawn ~/bin/bar-toast modal 't - Terminal in session'; ~/bin/term-sessions session-new", repeat = false }
"submap[sessions],Shift+t"     = { action = "spawn ~/bin/bar-toast modal 'T - Terminal in session (third)'; ~/bin/term-sessions session-new 0.333", repeat = false }
"submap[sessions],d"           = { action = "spawn ~/bin/bar-toast modal 'd - Detach'; ~/bin/term-sessions detach", repeat = false }
"submap[sessions],Shift+d"     = { action = "spawn ~/bin/term-sessions end", repeat = false }
"submap[sessions],s"           = { action = "spawn ~/bin/term-sessions close-all", repeat = false }
"submap[sessions],Shift+s"     = { action = "spawn ~/bin/term-sessions kill-all", repeat = false }
"submap[sessions],m"           = { action = "spawn ~/bin/bar-toast modal 'm - Move to session'; umbriel msg submap reset; ~/bin/term-sessions prompt move", submap = "reset", repeat = false }
"submap[sessions],Shift+m"     = { action = "spawn ~/bin/bar-toast modal 'M - Merge session'; umbriel msg submap reset; ~/bin/term-sessions prompt merge", submap = "reset", repeat = false }
"submap[sessions],c"           = { action = "spawn ~/bin/bar-toast modal 'c - Clone session'; umbriel msg submap reset; ~/bin/term-sessions prompt clone", submap = "reset", repeat = false }
"submap[sessions],Shift+c"     = { action = "spawn ~/bin/bar-toast modal 'C - Clone into session'; umbriel msg submap reset; ~/bin/term-sessions prompt join", submap = "reset", repeat = false }
"submap[sessions],slash"       = { action = "spawn ~/bin/bar-toast modal '/ - Open session'; umbriel msg submap reset; ~/bin/term-sessions prompt open", submap = "reset", repeat = false }
"submap[sessions],r"           = { action = "spawn ~/bin/bar-toast modal 'r - Rename session'; umbriel msg submap reset; ~/bin/term-sessions prompt rename", submap = "reset", repeat = false }
"submap[sessions],a"           = { action = "submap reset", repeat = false }
"submap[sessions],Escape"      = { action = "submap reset", repeat = false }
"submap[sessions],F1"          = { action = "spawn umbriel msg submap reset", submap = "reset", repeat = false }
