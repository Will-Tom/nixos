"Mod+bracketleft"  = "window-consume-or-expel-left"
"Mod+bracketright" = "window-consume-or-expel-right"

"Mod+R"       = { action = "spawn ~/bin/bar-toast super 'R - Cycle width'; umbriel msg window-cycle-primary-extent", repeat = false }
"Mod+F"       = { action = "spawn ~/bin/bar-toast super 'F - Maximize'; umbriel msg window-toggle-maximize", repeat = false }
"Mod+Shift+F" = { action = "spawn ~/bin/bar-toast super 'SHIFT + F - Fullscreen'; umbriel msg window-toggle-fullscreen", repeat = false }
"Mod+C"       = { action = "spawn ~/bin/bar-toast super 'C - Center column'; umbriel msg column-center", repeat = false }

"Mod+minus"       = "window-modify-primary-extent -0.1"
"Mod+equal"       = "window-modify-primary-extent +0.1"
"Mod+Shift+minus" = "window-modify-secondary-extent -0.1"
"Mod+Shift+equal" = "window-modify-secondary-extent +0.1"

"Mod+V"       = { action = "spawn ~/bin/bar-toast super 'V - Toggle floating'; umbriel msg window-toggle-floating", repeat = false }
"Mod+Shift+V" = { action = "spawn ~/bin/bar-toast super 'SHIFT + V - Float to region'; ~/bin/float-to-region.sh", repeat = false }

# Screen zoom around the pointer
"Mod+WheelUp"     = { action = "spawn ~/bin/zoom in", cooldown_ms = 80 }
"Mod+WheelDown"   = { action = "spawn ~/bin/zoom out", cooldown_ms = 80 }
"Mod+MouseMiddle" = { action = "spawn ~/bin/zoom reset", repeat = false }

